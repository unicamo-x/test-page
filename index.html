<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Test Page</title>
<style>
  /* System fonts only: the page makes no third-party requests. */
  body{margin:0;background:#0b0f17;color:#e6edf3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;}
  main{max-width:960px;margin:0 auto;padding:48px 20px;}
  h1{margin:0 0 4px;font-size:2rem;}
  .anon{color:#8b949e;margin:0 0 32px;}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  figure{margin:0;}
  figcaption{font-weight:600;margin-bottom:8px;}
  video{width:100%;aspect-ratio:832/480;border-radius:10px;background:#000;display:block;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<main>
  <h1>Placeholder Project: Test Page</h1>
  <p class="anon">Anonymous authors &middot; Hosting test, not real content</p>
  <p>This page only checks that GitHub Pages serves videos correctly: both clips should autoplay, loop and stay in step.</p>
  <div class="grid">
    <figure>
      <figcaption>Method A</figcaption>
      <video src="videos/sample_a.mp4" autoplay loop muted playsinline preload="auto"></video>
    </figure>
    <figure>
      <figcaption>Method B</figcaption>
      <video src="videos/sample_b.mp4" autoplay loop muted playsinline preload="auto"></video>
    </figure>
  </div>
</main>
</body>
</html>
